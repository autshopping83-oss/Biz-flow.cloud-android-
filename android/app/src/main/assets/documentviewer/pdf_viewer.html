<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>PDF Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; max-width: 100%; margin: 0; padding: 0; overflow-x: hidden; background: #525659; font-family: sans-serif; }
body { overflow: hidden; }
#toolbar { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: #323639; color: #fff; display: flex; align-items: center; padding: 0 12px; z-index: 100; }
#toolbar span { flex: 1; text-align: center; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#viewerContainer { position: fixed; top: 48px; bottom: 0; left: 0; right: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
#viewer { margin: 0 auto; width: 100%; max-width: 100vw; }
.page { margin: 8px auto; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.page canvas { display: block; width: 100%; height: auto; }
#loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #fff; font-size: 16px; z-index: 200; }
#error { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #ff6b6b; font-size: 14px; text-align: center; display: none; z-index: 200; }
</style>
</head>
<body>
<div id="toolbar">
  <span id="title">PDF Viewer</span>
</div>
<div id="loading">Loading PDF...</div>
<div id="error"></div>
<div id="viewerContainer">
  <div id="viewer"></div>
</div>
<script src="pdfjs/pdf.min.js"></script>
<script>
(function() {
  var viewerContainer = document.getElementById('viewerContainer');
  var viewer = document.getElementById('viewer');
  var loading = document.getElementById('loading');
  var errorDiv = document.getElementById('error');
  var titleEl = document.getElementById('title');

  function showError(msg) {
    loading.style.display = 'none';
    errorDiv.textContent = msg;
    errorDiv.style.display = 'block';
  }

  window.loadPdfFromBase64 = function(base64Data, fileName) {
    titleEl.textContent = fileName || 'PDF Viewer';
    try {
      var raw = atob(base64Data);
      var array = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) {
        array[i] = raw.charCodeAt(i);
      }
      renderPdf(array);
    } catch(e) {
      showError('Failed to decode PDF: ' + e.message);
    }
  };

  function renderPdf(data) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
    var dpr = window.devicePixelRatio || 1;

    pdfjsLib.getDocument({data: data}).promise.then(function(pdf) {
      loading.style.display = 'none';
      titleEl.textContent = (titleEl.textContent || 'PDF') + ' (' + pdf.numPages + ' pages)';

      var containerWidth = viewerContainer.clientWidth;
      var rendered = 0;
      var totalPages = pdf.numPages;

      function renderPage(pageNum) {
        pdf.getPage(pageNum).then(function(page) {
          var unscaledViewport = page.getViewport({scale: 1});
          var fitToWidthScale = containerWidth / unscaledViewport.width;
          var renderScale = fitToWidthScale * dpr;

          var viewport = page.getViewport({scale: renderScale});

          var div = document.createElement('div');
          div.className = 'page';
          div.id = 'page-' + pageNum;

          var canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.width = Math.floor(viewport.width / dpr) + 'px';
          canvas.style.height = Math.floor(viewport.height / dpr) + 'px';

          div.appendChild(canvas);
          viewer.appendChild(div);

          page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise.then(function() {
            rendered++;
            if (rendered === totalPages) {
              viewerContainer.style.visibility = 'visible';
            }
          });
        });
      }

      viewerContainer.style.visibility = 'hidden';
      for (var i = 1; i <= totalPages; i++) {
        renderPage(i);
      }
    }, function(err) {
      showError('PDF error: ' + err.message);
    });
  }
})();
</script>
</body>
</html>
