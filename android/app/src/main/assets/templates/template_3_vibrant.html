<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; color: #263238; font-size: 11px; }
    .page { position: relative; min-height: 297mm; }
    .top-header { background: #263238; color: white; padding: 30px; display: flex; justify-content: space-between; align-items: center; }
    .doc-badge { background: #FF9800; color: #263238; padding: 10px 20px; font-size: 20px; font-weight: 900; }
    .content { padding: 30px; }
    table.vibrant-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
    table.vibrant-table th { background: #263238; color: white; padding: 10px; }
    table.vibrant-table td { padding: 10px; border: 1px solid #CFD8DC; }
    .total-card { background: #ECEFF1; border-top: 3px solid #FF9800; padding: 12px; width: 220px; }
    .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; background: #263238; height: 15px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-header">
      <div>{{COMPANY_LOGO_HTML}}<div style="font-size: 22px; font-weight: bold; color: #FF9800;">{{COMPANY_NAME}}</div><div>{{COMPANY_DETAILS}}</div></div>
      <div class="doc-badge">{{DOC_TITLE}}</div>
    </div>
    <div class="content">
      <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
        <div><strong>Para:</strong> {{CLIENT_NAME}}<div>{{CLIENT_DETAILS}}</div></div>
        <div style="text-align:right;">Nº: <strong>{{DOC_NUMBER}}</strong><br>Data: <strong>{{DOC_DATE}}</strong></div>
      </div>
      <table class="vibrant-table">
        <thead><tr><th>Descrição</th><th style="text-align:right;">Preço</th><th style="text-align:right;">Qtd</th><th style="text-align:right;">Total</th></tr></thead>
        <tbody>{{ITEMS_TABLE_ROWS}}</tbody>
      </table>
      <div style="display:flex; justify-content:space-between;">
        <div style="width:50%;"><strong>Pagamento:</strong> {{PAYMENT_METHOD_INFO}}</div>
        <div class="total-card">
          <div style="display:flex; justify-content:space-between;"><span>Subtotal:</span><span>{{SUBTOTAL}}</span></div>
          <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:16px;"><span>Total:</span><span>{{TOTAL_AMOUNT}}</span></div>
        </div>
      </div>
    </div>
    <div class="bottom-bar"></div>
  </div>
</body>
</html>
