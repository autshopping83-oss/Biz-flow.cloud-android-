# Project-wide Gradle settings.

# Specifies the JVM arguments used for the Gradle daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Optional: run Gradle in incubating parallel mode.
# org.gradle.parallel=true

# AndroidX package structure
android.useAndroidX=true

# Include debug symbols in AAB
android.bundle.debugSymbolLevel=FULL